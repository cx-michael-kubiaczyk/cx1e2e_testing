name: Nightly - staging branches

on:
  schedule:
    - cron: '0 2 * * *'   # 2am UTC - gives the midnight main run time to finish/settle
  workflow_dispatch: {}    # allow manual trigger for debugging

permissions:
  contents: read
  checks: write

jobs:
  check-diff:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.cmp.outputs.skip }}
    steps:
      - name: Compare staging to main SHAs
        id: cmp
        run: |
          CG_MAIN=$(git ls-remote https://github.com/cxpsemea/cx1clientgo main | cut -f1)
          CG_STAGE=$(git ls-remote https://github.com/cxpsemea/cx1clientgo staging | cut -f1)
          E2E_MAIN=$(git ls-remote https://github.com/cxpsemea/cx1e2e main | cut -f1)
          E2E_STAGE=$(git ls-remote https://github.com/cxpsemea/cx1e2e staging | cut -f1)

          echo "cx1clientgo main=$CG_MAIN staging=$CG_STAGE"
          echo "cx1e2e       main=$E2E_MAIN staging=$E2E_STAGE"

          if [ "$CG_MAIN" = "$CG_STAGE" ] && [ "$E2E_MAIN" = "$E2E_STAGE" ]; then
            echo "Staging matches main for both repos - skipping run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Staging differs from main - running full suite"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  run-suite:
    needs: check-diff
    if: needs.check-diff.outputs.skip == 'false'
    runs-on: ubuntu-latest
    env:
      CG_REPO: cxpsemea/cx1clientgo
      E2E_REPO: cxpsemea/cx1e2e
      CANARY_CX1_URL: ${{ secrets.CANARY_CX1_URL }}
      CANARY_IAM_URL: ${{ secrets.CANARY_IAM_URL }}
      CANARY_CLIENT_ID: ${{ secrets.CANARY_CLIENT_ID }}
      CANARY_CLIENT_SECRET: ${{ secrets.CANARY_CLIENT_SECRET }}
      CANARY_TENANT: ${{ secrets.CANARY_TENANT }}
    steps:
      - name: Checkout orchestrator repo (scripts)
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Checkout cx1clientgo (staging)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CG_REPO }}
          ref: staging
          path: cx1clientgo

      - name: Checkout cx1e2e (staging)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E2E_REPO }}
          ref: staging
          path: cx1e2e

      - name: Set permissions
        run: chmod u+x ./.github/scripts/*.sh

      - name: Set up go.work linking both checkouts
        run: ./.github/scripts/setup-workspace.sh cx1clientgo cx1e2e

      - name: Run full suite against Canary
        id: run-suite
        run: ./.github/scripts/run-full-suite.sh
        env:
          RUN_LABEL: nightly-staging

      - name: Report unstable status
        if: steps.run-suite.outputs.status == 'unstable'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'cx1e2e suite (nightly-staging)',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Some tests failed',
                summary: 'The suite ran to completion but reported failing tests (exit code ${{ steps.run-suite.outputs.exit_code }}). See the job summary for the failing tests.'
              }
            });

      - name: Fail job if suite did not run
        if: steps.run-suite.outputs.status == 'failed'
        run: |
          echo "cx1e2e suite crashed / did not complete (exit code ${{ steps.run-suite.outputs.exit_code }})"
          exit 1

      - name: Notify Microsoft Teams
        if: always()
        run: ./.github/scripts/notify-teams.sh
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          STATUS: ${{ steps.run-suite.outputs.status }}
          EXIT_CODE: ${{ steps.run-suite.outputs.exit_code }}
          RUN_LABEL: nightly-staging

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-staging-results
          path: results/
          retention-days: 30
